# A schedule file, not a definition: validated against cron-schema.json, and every entry must
# name a workflow defined in this directory (by declared id, or the id derived from its path).
- cron: "0 30 6 * * *"
  workflow: nightly
  zone: UTC
  variables:
    mode: early
    dryRun: true
- cron: "@weekly"
  workflow: seq
