id: agent-foreach
name: Assess every claim with a published agent
version: 1
steps:
  - { id: start, type: START, name: Start }
  - id: assess
    type: AGENT
    name: Assess a claim
    preconditionStepId: start
    forEach:
      items: claims
      as: claim
      output: assessments
      outputElement: assessment
    agent:
      ref: claims-assessor
      taskPrompt: "Assess claim ${claim.id}"
      input: {claimId: "${claim.id}", position: "${index}"}
      outputVariable: assessment
  - { id: end, type: END, name: End, preconditionStepId: assess }
